apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-todo-app
  namespace: default
  labels:
    app: demo-todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-todo-app
  template:
    metadata:
      labels:
        app: demo-todo-app
    spec:
      containers:
        - name: demo-todo-app
          image: demo-todo-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-todo-app
  namespace: default
  labels:
    app: demo-todo-app
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: demo-todo-app
